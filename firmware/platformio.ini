; ============================================================================
; Aerodeck V2 - PlatformIO Configuration
; ESP32-C5 (RISC-V single-core @ 240 MHz, 384 KB HP SRAM)
; Arduino-ESP32 v3.3.x / ESP-IDF v5.5.x
; ============================================================================
;
; NOTE: pioarduino release version may need updating as new IDF 5.5.x
;       builds ship. If the URL 404s, check:
;       https://github.com/pioarduino/platform-espressif32/releases
;       and replace 55.03.31 with the latest 55.03.xx tag.
; ============================================================================

[env:aerodeck-v2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Force UART0 console on GPIO11/12 so GPIO13/14 are free for IR_TX / SD_CS.
; The BusManager emits a compile-time #error if this is ever overridden.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

; Uncomment once the display module lands in Step 2:
;   lovyan03/LovyanGFX@^1.1.16
